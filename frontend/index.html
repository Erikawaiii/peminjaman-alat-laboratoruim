<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Peminjaman Alat Lab</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
    <nav class="navbar navbar-expand-lg navbar-dark bg-dark">
        <div class="container">
            <a class="navbar-brand" href="#">Peminjaman Alat Lab</a>
            <div class="navbar-nav ms-auto">
                <a class="nav-link active" href="#">Beranda</a>
                <a class="nav-link" href="#">Peminjaman</a>
            </div>
        </div>
    </nav>
    <div class="container mt-4">
        <h1 class="mb-4">Kategori Alat</h1>
        <div id="kategori_alat-container" class="row"></div>

        <h5>Daftar Alat</h5>
        <div id="alat-container" class="row"></div>
    </div>
    <div class="mt-5" id="peminjaman">
        <h2>Form Peminjaman</h2>
        <form id="peminjaman-form">
            <div class="mb-3">
                <label for="nama_peminjam" class="form-label">Nama peminjam</label>
                <input type="text" class="form-control" id="nama_peminjam" required>
            </div>
            <div class="mb-3">
                <label for="alat" class="form-label">Alat</label>
                <select class="form-select" id="alat" required>
                    <option value="">Pilih alat</option>
                </select>
            </div>
           <div class="mb-3">
            <label class="form-label">Jumlah</label>
            <input type="number" class="form-control" id="jumlah" required>
           </div>
           <div class="mb-3">
            <label for="tanggal_pinjam" class="form-label">Tanggal Pinjam</label>
            <input type="date" class="form-control" id="tanggal_pinjam" required>
    </div>
    <div class="mb-3">
        <label for="tanggal_kembali" class="form-label">Tanggal Kembali</label>
        <input type="date" class="form-control" id="tanggal_kembali" required>
    </div>
    <button type="submit" class="btn btn-primary bg-dark">Pinjam</button


    <script src="app.js"></script>
</body>
</html>
